syntax = "proto3";

package elastic.v1;
option go_package = "github.com/ReilEgor/Vaca/services/SearchService/api/gen/elastic/v1;elasticv1";

message Vacancy {
  string id = 1;
  string title = 2;
  string description = 3;
  string link = 4;
  string company = 5;
  string salary = 6;
  string location = 7;
  string requirements = 8;
  string about = 9;
}

message VacancyFilter {
  string query = 1;
  string location = 2;
  string requirements = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ScrapeResult{
  string task_id = 1;
  repeated Vacancy vacancies = 2;
}

// SetVacancies
message SetVacanciesRequest{
  ScrapeResult result = 1;
}

message SetVacanciesResponse{

}

// GetVacancies
message GetVacanciesRequest{
  VacancyFilter filter = 1;
}
message GetVacanciesResponse{
  repeated Vacancy vacancies = 1;
}

service SearchService {
  rpc SetVacancies (SetVacanciesRequest) returns (SetVacanciesResponse);
  rpc GetVacancies (GetVacanciesRequest) returns (GetVacanciesResponse);
}